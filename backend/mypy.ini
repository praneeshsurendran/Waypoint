[mypy]
python_version = 3.13
mypy_path = $MYPY_CONFIG_FILE_DIR/services/operations/src:$MYPY_CONFIG_FILE_DIR/services/identity-access/src:$MYPY_CONFIG_FILE_DIR/services/network-fleet/src:$MYPY_CONFIG_FILE_DIR/services/notifications/src:$MYPY_CONFIG_FILE_DIR/packages/contracts:$MYPY_CONFIG_FILE_DIR/packages/security:$MYPY_CONFIG_FILE_DIR/packages/observability:$MYPY_CONFIG_FILE_DIR/packages/messaging:$MYPY_CONFIG_FILE_DIR/packages/runtime
files = $MYPY_CONFIG_FILE_DIR/services/operations/src/app, $MYPY_CONFIG_FILE_DIR/services/identity-access/src/waypoint_identity, $MYPY_CONFIG_FILE_DIR/services/network-fleet/src/waypoint_network, $MYPY_CONFIG_FILE_DIR/services/notifications/src/waypoint_notifications, $MYPY_CONFIG_FILE_DIR/packages
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True
disallow_untyped_defs = True
