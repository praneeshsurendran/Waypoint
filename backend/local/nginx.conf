events {}
http {
  # Error responses contain no credentials/data; expose throttling only to local frontend origins.
  map $http_origin $local_error_origin {
    default "";
    ~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
  }
  limit_req_zone $binary_remote_addr zone=edge_clients:10m rate=100r/s;
  # Docker DNS must be refreshed after service containers are recreated.
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8080;
    limit_req zone=edge_clients burst=100 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    proxy_set_header X-Forwarded-For $remote_addr;
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      add_header Access-Control-Allow-Origin $local_error_origin always;
      add_header Access-Control-Expose-Headers Retry-After always;
      add_header Vary Origin always;
      add_header X-Content-Type-Options nosniff always;
      return 429 '{"detail":{"code":"RATE_LIMITED","message":"Too many requests."}}';
    }
    set $identity_target identity:8000;
    set $network_target network:8000;
    set $operations_target operations:8000;
    set $notifications_target notifications:8000;

    client_max_body_size 9m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    location /api/v1/auth/ { proxy_pass http://$identity_target; }
    location ~ ^/api/v1/admin/users(?:/|$) { proxy_pass http://$identity_target; }
    location = /api/v1/reference/store-managers { proxy_pass http://$identity_target; }
    location /api/v1/reference/ { proxy_pass http://$network_target; }
    location = /api/v1/admin/outlets { proxy_pass http://$network_target; }
    location = /api/v1/admin/vehicles { proxy_pass http://$network_target; }
    location /api/v1/notifications { proxy_pass http://$notifications_target; }
    location / { proxy_pass http://$operations_target; }
  }
}
