[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-security"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.4","httpx==0.28.0","pydantic==2.10.2","waypoint-observability==0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["waypoint_*"]
namespaces = true
